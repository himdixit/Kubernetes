apiVersion: v1
kind: Pod
metadata:
  name: mongodb
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: mongodb
spec:
  containers:
  - name: mongodb
    image: mongo:7
    ports:
      - containerPort: 27017
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
